<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Admin Login — TRJTA 24</title>
  <meta name="description" content="Portal Masuk Administrator Website TRJTA 24">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="../../assets/icons/favicon.png">
  <link rel="apple-touch-icon" href="../../assets/icons/favicon.png">

  <!-- Font Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Admin Stylesheet -->
  <link rel="stylesheet" href="../../assets/css/admin.css">
</head>
<body class="admin-auth-page">

  <div class="auth-card">
    <div class="auth-header">
      <img src="../../assets/images/trjta24-logo.png" alt="Logo Resmi TRJTA 24" class="auth-brand-logo">
      <h1 class="auth-title">Admin Panel</h1>
      <p class="auth-subtitle">Sistem Pengelolaan Informasi Kelas TRJTA 24</p>
      <div class="auth-badge">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        <span>Area Terbatas</span>
      </div>
    </div>

    <!-- Alert Box -->
    <div id="authAlert" class="auth-alert" role="alert">
      <svg id="alertIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
      <span id="alertMsg">Pesan status</span>
    </div>

    <!-- Login Form -->
    <form id="loginForm" class="auth-form" novalidate>
      <div class="form-group">
        <label for="loginEmail" class="form-label">Email Administrator <span class="required">*</span></label>
        <div class="input-icon-wrap">
          <span class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
          </span>
          <input 
            type="email" 
            id="loginEmail" 
            class="form-input" 
            placeholder="admin@trjta24.ac.id" 
            required 
            autocomplete="email"
            autofocus
          >
        </div>
      </div>

      <div class="form-group">
        <label for="loginPassword" class="form-label">Kata Sandi <span class="required">*</span></label>
        <div class="input-icon-wrap">
          <span class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          </span>
          <input 
            type="password" 
            id="loginPassword" 
            class="form-input" 
            placeholder="••••••••" 
            required 
            autocomplete="current-password"
          >
          <button type="button" id="togglePwdBtn" class="btn-toggle-pwd" aria-label="Lihat kata sandi">
            <svg id="pwdEyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
      </div>

      <button type="submit" id="submitBtn" class="btn btn-primary btn-block" style="margin-top: 10px;">
        <span id="btnText">Masuk ke Panel Admin</span>
        <div id="btnSpinner" class="spinner" style="display: none;"></div>
      </button>
    </form>

    <div class="auth-footer-links">
      <a href="../../index.html" class="auth-back-link">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        <span>Kembali ke Website TRJTA 24</span>
      </a>
    </div>
  </div>

  <!-- Supabase Client & Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/supabase.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const form = document.getElementById('loginForm');
      const emailInput = document.getElementById('loginEmail');
      const pwdInput = document.getElementById('loginPassword');
      const submitBtn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const btnSpinner = document.getElementById('btnSpinner');
      const togglePwdBtn = document.getElementById('togglePwdBtn');
      const alertBox = document.getElementById('authAlert');
      const alertMsg = document.getElementById('alertMsg');

      function showAlert(message, type = 'danger') {
        alertBox.className = `auth-alert show ${type}`;
        alertMsg.textContent = message;
      }

      function hideAlert() {
        alertBox.className = 'auth-alert';
        alertMsg.textContent = '';
      }

      function setLoading(loading) {
        submitBtn.disabled = loading;
        btnSpinner.style.display = loading ? 'inline-block' : 'none';
        btnText.textContent = loading ? 'Memverifikasi Akses...' : 'Masuk ke Panel Admin';
      }

      // Toggle Password Visibility
      if (togglePwdBtn) {
        togglePwdBtn.addEventListener('click', () => {
          const isPassword = pwdInput.type === 'password';
          pwdInput.type = isPassword ? 'text' : 'password';
          togglePwdBtn.innerHTML = isPassword
            ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`
            : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
        });
      }

      // Periksa apakah Supabase telah dikonfigurasi
      if (typeof isSupabaseConfigured !== 'function' || !isSupabaseConfigured()) {
        showAlert('Supabase belum dikonfigurasi. Harap isi SUPABASE_URL dan SUPABASE_ANON_KEY pada assets/js/config.js.', 'danger');
        return;
      }

      // Periksa apakah sesi saat ini sudah login sebagai admin
      try {
        if (window.AuthAPI) {
          const user = await window.AuthAPI.getUser();
          if (user) {
            const isAdmin = await window.AuthAPI.isAdmin();
            if (isAdmin) {
              window.location.href = '../dashboard/';
              return;
            }
          }
        }
      } catch (err) {
        console.warn('Cek sesi login:', err);
      }

      // Handle Form Submit
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideAlert();

        const email = emailInput.value.trim();
        const password = pwdInput.value;

        if (!email || !password) {
          showAlert('Email dan kata sandi wajib diisi.', 'danger');
          return;
        }

        setLoading(true);

        try {
          const api = window.AuthAPI || (typeof AuthAPI !== 'undefined' ? AuthAPI : null);
          if (!api) {
            throw new Error('Sistem autentikasi belum siap. Silakan refresh halaman.');
          }

          const authResult = await api.login(email, password);
          showAlert('Autentikasi berhasil! Mengalihkan ke Dashboard...', 'success');
          setTimeout(() => {
            window.location.href = '../dashboard/';
          }, 600);

        } catch (err) {
          console.error('Error saat login admin:', err);
          let errorText = err && err.message ? err.message : 'Terjadi kesalahan sistem saat mencoba masuk. Silakan coba lagi.';
          if (errorText.toLowerCase().includes('invalid login credentials')) {
            errorText = 'Email atau kata sandi tidak sesuai. Silakan periksa kembali.';
          }
          showAlert(errorText, 'danger');
          setLoading(false);
        }
      });
    });
  </script>
</body>
</html>
